<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plano ENEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white min-h-screen font-sans">

      <!-- Navbar -->
  <nav class="w-full px-8 py-6 flex justify-between items-center border-b border-gray-100">
    <h1 class="text-xl font-semibold tracking-wide">Projeto ENEM</h1>
    <span class="text-sm text-gray-400">Rumo ao Direito ⚖️</span>
  </nav>

  <!-- Header -->
  <header class="text-center py-12">
    <h1 class="text-4xl font-bold text-gray-800">
      Plano de Estudos ENEM ⚖️
    </h1>
    <p class="text-gray-500 mt-3 text-lg">
        Para futura Juíza
    </p>
  </header>

  <!-- Grid de Matérias -->
  <main class="max-w-6xl mx-auto px-6 pb-16">
    <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">

      <!-- Linguagens -->
      <a href="paginas/linguagens.html"
           class="cursor-pointer rounded-2xl overflow-hidden shadow-lg transform hover:scale-105 transition duration-300">
        <div class="h-40 bg-cover bg-center"
             style="background-image: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f');">
        </div>
        <div class="bg-pink-500 text-white p-6">
          <h2 class="text-2xl font-bold">Linguagens</h2>
          <p class="mt-2">Segunda e Quinta</p>
        </div>
      </a>

      <!-- Matemática -->
      <a href="paginas/matematica.html"
           class="cursor-pointer rounded-2xl overflow-hidden shadow-lg transform hover:scale-105 transition duration-300">
        <div class="h-40 bg-cover bg-center"
             style="background-image: url('https://images.unsplash.com/photo-1509228468518-180dd4864904');">
        </div>
        <div class="bg-blue-600 text-white p-6">
          <h2 class="text-2xl font-bold">Matemática</h2>
          <p class="mt-2">Terça-feira</p>
        </div>
      </a>

      <!-- Ciências Humanas -->
      <a href="paginas/ciencias-humanas.html" 
           class="cursor-pointer rounded-2xl overflow-hidden shadow-lg transform hover:scale-105 transition duration-300">
        <div class="h-40 bg-cover bg-center"
             style="background-image: url('https://images.unsplash.com/photo-1461360228754-6e81c478b882');">
        </div>
        <div class="bg-amber-500 text-white p-6">
          <h2 class="text-2xl font-bold">Ciências Humanas</h2>
          <p class="mt-2">Quarta-feira</p>
        </div>
      </a>

      <!-- Ciências da Natureza -->
      <a href="paginas/ciencias-natureza.html"
           class="cursor-pointer rounded-2xl overflow-hidden shadow-lg transform hover:scale-105 transition duration-300">
        <div class="h-40 bg-cover bg-center"
             style="background-image: url('https://images.unsplash.com/photo-1532094349884-543bc11b234d');">
        </div>
        <div class="bg-green-600 text-white p-6">
          <h2 class="text-2xl font-bold">Ciências da Natureza</h2>
          <p class="mt-2">Sexta-feira</p>
        </div>
      </a>

    </div>
  </main>
</body>
</html>
